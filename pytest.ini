[pytest]
testpaths = tests
asyncio_mode = auto
filterwarnings =
    # Keep every warning visible. Runtime/deprecation warnings fail unless one
    # of the two precise, documented upstream exceptions below matches.
    default
    error::DeprecationWarning
    error::RuntimeWarning
    # discord.py imports deprecated audioop (removed in 3.13) — external dep, not actionable
    default:.*audioop.*:DeprecationWarning:discord.player
    # AsyncMock internals create unawaited coroutines during __init__ — CPython mock issue
    default:coroutine 'AsyncMockMixin\._execute_mock_call' was never awaited:RuntimeWarning:unittest.mock
