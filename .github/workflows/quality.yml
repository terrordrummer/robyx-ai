name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            lock: "requirements/locks/dev-py310.txt"
          - python: "3.11"
            lock: "requirements/locks/dev-py311.txt"
          - python: "3.12"
            lock: "requirements/locks/dev-py312.txt"
          - python: "3.13"
            lock: "requirements/locks/dev-py313.txt"
          - python: "3.14"
            lock: "requirements/locks/dev-py314.txt"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: Install the locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.7
          uv pip sync --system "${{ matrix.lock }}"
      - name: Critical lint gate
        run: ruff check bot tests setup.py
      - name: Typed resilience boundaries
        run: mypy
      - name: Tests, warnings, and coverage
        run: >-
          pytest -ra
          --cov=bot
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=80
      - name: Risk-path coverage ratchet
        run: python scripts/check_coverage.py coverage.json

  dependency-drift:
    name: Dependency constraint drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check uv==0.11.7
      - run: python scripts/check_constraints.py --check
